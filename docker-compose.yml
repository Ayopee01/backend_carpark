services:
  api:
    build: .
    container_name: smart-carpark-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-smart_carpark}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-smart_carpark_uat}?schema=public
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      - ./uploads:/app/uploads

  db:
    image: postgres:16-alpine
    container_name: smart-carpark-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_carpark_uat}
      POSTGRES_USER: ${POSTGRES_USER:-smart_carpark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-smart_carpark} -d $${POSTGRES_DB:-smart_carpark_uat}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    container_name: smart-carpark-nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
